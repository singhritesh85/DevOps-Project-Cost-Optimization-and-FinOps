apiVersion: v1
kind: Namespace
metadata:
  name: therema
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: therema-pvc
  namespace: therema
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: managed-csi
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: therema-pod
  namespace: therema
spec:
  containers:
    - name: therema-app-container
      image: nginx:latest
      volumeMounts:
        - mountPath: /data
          name: persistent-storage
  volumes:
    - name: persistent-storage
      persistentVolumeClaim:
        claimName: therema-pvc
