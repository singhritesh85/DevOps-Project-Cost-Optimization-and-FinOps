apiVersion: v1
kind: Namespace
metadata:
  name: dexter
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: azure-blob-pvc
  namespace: dexter
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: azureblob-fuse-sc
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpd-azure-blob-logging-deployment
  namespace: dexter
  labels:
    app: httpd-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: httpd-app
  template:
    metadata:
      labels:
        app: httpd-app
    spec:
      containers:
        - name: httpd-container
          image: httpd:2.4
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /local-logs
              cat << 'EOF' > /usr/local/apache2/conf/extra/httpd-azure-blob-logging.conf
              CustomLog "|/usr/local/apache2/bin/rotatelogs -l /local-logs/access-%Y-%m-%d.log 86400" combined
              ErrorLog "|/usr/local/apache2/bin/rotatelogs -l /local-logs/error-%Y-%m-%d.log 86400"
              EOF
              echo "Include conf/extra/httpd-azure-blob-logging.conf" >> /usr/local/apache2/conf/httpd.conf
              exec httpd-foreground
          ports:
            - containerPort: 80
          volumeMounts:
            - name: local-log-storage
              mountPath: /local-logs
        - name: log-shipper
          image: busybox:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /var/log/httpd
              while true; do
                YESTERDAY=$(date -u -D "%s" -d "$(( $(date +%s) - 86400 ))" +%Y-%m-%d 2>/dev/null || date -u -d "1 day ago" +%Y-%m-%d 2>/dev/null || TZ=UTC date -v-1d +%Y-%m-%d)
                if [ -f "/local-logs/access-${YESTERDAY}.log" ] && [ ! -f "/var/log/httpd/client-logs-${YESTERDAY}-${HOSTNAME}.tar.gz" ]; then
                  cd /local-logs
                  tar -czf /var/log/httpd/client-logs-${YESTERDAY}-${HOSTNAME}.tar.gz *${YESTERDAY}*.log
                  cd /
                fi
                sleep 3600
              done
          volumeMounts:
            - name: local-log-storage
              mountPath: /local-logs
            - name: azure-blob-storage
              mountPath: /var/log/httpd

      volumes:
        - name: local-log-storage
          emptyDir: {}
        - name: azure-blob-storage
          persistentVolumeClaim:
            claimName: azure-blob-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: httpd-loadbalancer-svc
  namespace: dexter
  labels:
    app: httpd-app
spec:
  type: LoadBalancer
  selector:
    app: httpd-app
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
