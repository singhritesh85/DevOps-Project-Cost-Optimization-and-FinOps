# 1. ARM64 NODE CLASS (For System and On-Demand User Pools)
apiVersion: karpenter.azure.com/v1beta1
kind: AKSNodeClass
metadata:
  name: arm64-infra-class
spec:
  vnetSubnetID: "<YOUR_SUBNET_RESOURCE_ID>"
  imageFamily: Ubuntu
  osDiskSizeGB: 30
  security:
    encryptionAtHost: true
---
# 2. AMD64 NODE CLASS (For Spot User Pool)
apiVersion: karpenter.azure.com/v1beta1
kind: AKSNodeClass
metadata:
  name: amd64-infra-class
spec:
  vnetSubnetID: "<YOUR_SUBNET_RESOURCE_ID>"
  imageFamily: Ubuntu
  osDiskSizeGB: 30
  security:
    encryptionAtHost: true
---
# 3. SYSTEMPOOL AGENT - ON-DEMAND COBALT POOL (ARM64)
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: system-surge-karpenter     ###systempool-ondemand-cobalt
spec:
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
  template:
    metadata:
      labels:
        kubernetes.azure.com/mode: system
    spec:
      nodeClassRef:
        group: karpenter.azure.com
        kind: AKSNodeClass
        name: arm64-infra-class
      taints:
        - key: CriticalAddonsOnly
          value: "true"
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: karpenter.azure.com/sku-name
          operator: In
          values: ["Standard_E2pds_v6", "Standard_E4pds_v6", "Standard_E8pds_v6"]
---
# 4. USERPOOL AGENT - ON-DEMAND COBALT POOL (ARM64)
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: userpool-ondemand-cobalt
spec:
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
  template:
    spec:
      nodeClassRef:
        group: karpenter.azure.com
        kind: AKSNodeClass
        name: arm64-infra-class
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: karpenter.azure.com/sku-name
          operator: In
          values: ["Standard_E2pds_v6", "Standard_E4pds_v6", "Standard_E8pds_v6"]
---
# 5. USERPOOL AGENT - SPOT AMD64 POOL (AMD64)
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: userpool-spot-amd64
spec:
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
  template:
    spec:
      nodeClassRef:
        group: karpenter.azure.com
        kind: AKSNodeClass
        name: amd64-infra-class
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: karpenter.azure.com/sku-name
          operator: In
          values: ["Standard_D2ads_v5", "Standard_D4ads_v5", "Standard_D8ads_v5"]
