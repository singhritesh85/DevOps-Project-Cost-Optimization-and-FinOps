apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-2
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mysql-aws-external-secret
  namespace: mysql
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: mysql-secret
    creationPolicy: Owner
  data:
    - secretKey: mysql-root-password
      remoteRef:
        key: networkoptimization-mysql-root-credentialsXXXXXXXXXXXXXXXXXXXXXXXXXX  ### Provide AWS Secrets Manager secret name.
        property: mysql-root-password
    - secretKey: mysql-replication-password
      remoteRef:
        key: networkoptimization-mysql-root-credentialsXXXXXXXXXXXXXXXXXXXXXXXXXX  ### Provide AWS Secrets Manager secret name.
        property: mysql-replication-password
