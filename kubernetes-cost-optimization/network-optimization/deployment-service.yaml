apiVersion: v1
kind: Namespace
metadata:
  name: dexter
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpd-deployment
  namespace: dexter
  labels:
    app: httpd-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: httpd-app
  template:
    metadata:
      labels:
        app: httpd-app
    spec:
      containers:
        - name: httpd-container
          image: httpd:2.4
---
apiVersion: v1
kind: Service
metadata:
  name: httpd-svc
  namespace: dexter
  labels:
    app: httpd-app
spec:
  type: ClusterIP
  selector:
    app: httpd-app
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
