apiVersion: gateway.k8s.aws/v1
kind: LoadBalancerConfiguration
metadata:
  name: httpd-alb-config
  namespace: dexter
spec:
  scheme: internet-facing
  ipAddressType: ipv4
  listenerConfigurations:
    - protocolPort: HTTPS:443
      defaultCertificate: arn:aws:acm:us-east-2:02XXXXXXXXX6:certificate/XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX
      sslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
    - protocolPort: HTTP:80
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: httpd-gateway
  namespace: dexter
  annotations:
    gateway.networking.k8s.io/policy: Direct
spec:
  gatewayClassName: amazon-eks-controller
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: httpd-alb-config
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "dexter.singhritesh85.com"
      allowedRoutes:
        namespaces:
          from: Same
    - name: http
      protocol: HTTP
      port: 80
      hostname: "dexter.singhritesh85.com"
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpd-route
  namespace: dexter
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: httpd-gateway
    namespace: dexter
    sectionName: https
  hostnames:
  - "dexter.singhritesh85.com"
  rules:
  - backendRefs:
    - name: httpd-svc
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  namespace: dexter
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: httpd-gateway
    namespace: dexter
    sectionName: http
  hostnames:
  - "dexter.singhritesh85.com"
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
