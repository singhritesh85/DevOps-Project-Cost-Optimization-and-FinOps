apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bankapp-route
  namespace: bankapp
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: shared-cluster-gateway
    namespace: networking   # Point to the same shared Gateway
    sectionName: https
  hostnames:
  - "bankapp.singhritesh85.com"
  rules:
  - backendRefs:
    - name: bankapp-folo
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bankapp-http-to-https-redirect
  namespace: bankapp
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: shared-cluster-gateway
    namespace: networking
    sectionName: http
  hostnames:
  - "bankapp.singhritesh85.com"
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
---
apiVersion: gateway.k8s.aws/v1
kind: TargetGroupConfiguration
metadata:
  name: bankapp-target-config
  namespace: bankapp
spec:
  targetReference:
    group: ""
    kind: Service
    name: bankapp-folo
  defaultConfiguration:
    targetType: ip
