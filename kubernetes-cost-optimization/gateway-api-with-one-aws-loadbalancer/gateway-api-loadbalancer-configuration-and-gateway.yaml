---
apiVersion: v1
kind: Namespace
metadata:
  name: networking
---
apiVersion: gateway.k8s.aws/v1
kind: LoadBalancerConfiguration
metadata:
  name: shared-alb-config
  namespace: networking
spec:
  scheme: internet-facing
  ipAddressType: ipv4
  listenerConfigurations:
    - protocolPort: HTTPS:443
      defaultCertificate: arn:aws:acm:us-east-2:02XXXXXXXXX6:certificate/XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX
      sslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
    - protocolPort: HTTP:80
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared-cluster-gateway
  namespace: networking
  annotations:
    gateway.networking.k8s.io/policy: Direct
spec:
  gatewayClassName: amazon-eks-controller
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: shared-alb-config
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All  # Allows HTTPRoutes from namespaces like argocd and bankapp to attach here
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
