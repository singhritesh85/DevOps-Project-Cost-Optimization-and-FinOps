apiVersion: gateway.k8s.aws/v1
kind: LoadBalancerConfiguration
metadata:
  name: bankapp-alb-config
  namespace: bankapp
spec:
  scheme: internet-facing
  ipAddressType: ipv4
  listenerConfigurations:
    - protocolPort: HTTPS:443
      defaultCertificate: arn:aws:acm:us-east-2:027330342406:certificate/2e30cafc-01d5-45ca-b65e-d90c18118df1
      sslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
    - protocolPort: HTTP:80
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: bankapp-gateway
  namespace: bankapp
  annotations:
    gateway.networking.k8s.io/policy: Direct
spec:
  gatewayClassName: amazon-eks-controller
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: bankapp-alb-config
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "bankapp.singhritesh85.com"
      allowedRoutes:
        namespaces:
          from: Same
    - name: http
      protocol: HTTP
      port: 80
      hostname: "bankapp.singhritesh85.com"
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpd-route
  namespace: bankapp
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: bankapp-gateway
    namespace: bankapp
    sectionName: https
  hostnames:
  - "bankapp.singhritesh85.com"
  rules:
  - backendRefs:
    - name: bankapp-folo
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  namespace: bankapp
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: bankapp-gateway
    namespace: bankapp
    sectionName: http
  hostnames:
  - "bankapp.singhritesh85.com"
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
---
apiVersion: gateway.k8s.aws/v1
kind: TargetGroupConfiguration
metadata:
  name: bankapp-target-config
  namespace: bankapp
spec:
  targetReference:
    group: ""
    kind: Service
    name: bankapp-folo
  defaultConfiguration:
    targetType: ip
